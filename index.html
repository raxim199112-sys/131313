  [1, 'Kimyo', 'Химия', 'Химия'],
  [1, 'Biologiya', 'Биология', 'Биология'],
  [1, 'Geografiya', 'География', 'География'],
  [2, 'Ona tili', 'Ана тілі', 'Родной язык'],
  [2, 'Adabiyot', 'Әдебиет', 'Литература'],
  [2, 'Ingliz tili', 'Ағылшын тілі', 'Английский язык'],
  [2, 'Rus tili', 'Орыс тілі', 'Русский язык'],
  [3, 'Tarix', 'Тарих', 'История'],
  [3, 'Huquq', 'Құқық', 'Право'],
  [3, 'Jismoniy tarbiya', 'Дене шынықтыру', 'Физкультура'],
  [3, 'Boshlang‘ich sinf', 'Бастауыш сынып', 'Начальные классы']
];
const M = {
  sh: 'ш', ch: 'ч', yo: 'ё', yu: 'ю', ya: 'я', 'o‘': 'ў', 'g‘': 'ғ',
  a: 'а', b: 'б', d: 'д', e: 'е', f: 'ф', g: 'г', h: 'ҳ', i: 'и', j: 'ж',
  k: 'к', l: 'л', m: 'м', n: 'н', o: 'о', p: 'п', q: 'қ', r: 'р', s: 'с',
  t: 'т', u: 'у', v: 'в', x: 'х', y: 'й', z: 'з'
};
const cyr = s => s.replace(/sh|ch|yo|yu|ya|o‘|g‘|./gi, m => {
  const l = M[m.toLowerCase()];
  return l ? (m[0] !== m[0].toLowerCase() ? l[0].toUpperCase() + l.slice(1) : l) : m;
});
const LO = { 0: 0, 2000: 1, 2001: 2 };

function mk(id, type, nm, subject, cat) {
  return {
    id,
    type,
    name: [nm, cyr(nm), cyr(nm)],
    subject,
    cat,
    experience: '—',
    degree: '—',
    bio: '—',
    achievements: '—',
    phone: id === 0 ? '+998 (71) 200-13-13' : '',
    photo: ''
  };
}

function seed() {
  const N = [
    'Karimova Dilnoza', 'Toshmatov Aziz', 'Rahimova Nigora', 'Ismoilov Doniyor', 'Sobirova Gulnora',
    'Ergashev Sardor', 'Xolmatova Zilola', 'Abdullayeva Madina', 'Normatov Jamshid', 'Hasanova Shahnoza',
    'Mirzayev Akmal', 'Turgunova Feruza', 'Sultonov Bekzod', 'Qosimova Sevara', 'Aliyev Ulug‘bek',
    'Usmonova Barno', 'Saidov Rustam', 'Jo‘rayeva Kamola', 'Tursunov Eldor', 'Qo‘ziyeva Mohira',
    'Bekmurodov Sanjar', 'Ahmedova Nodira', 'Davronov Islom', 'Qobilova Lola', 'Hakimov Farrux',
    'Mamatqulova Sabina', 'Rustamov Behruz', 'Nurmatova Zarina', 'Olimov Shaxzod', 'Ibragimova Muhayyo'
  ];
  const d = {
    students: 365,
    teachers: [
      mk(0, 'leader', 'Yusupov Sherzod', ['Maktab direktori', 'Мектеп директоры', 'Директор школы'], -1),
      mk(2000, 'leader', 'Nazarova Malika', ['O‘quv ishlari bo‘yicha direktor o‘rinbosari (zavuch)', 'Директордың оқу ісі жөніндегі орынбасары (завуч)', 'Завуч (зам. директора по учебной работе)'], -1),
      mk(2001, 'leader', 'Qodirov Otabek', ['Ma’naviy-ma’rifiy ishlar bo‘yicha o‘rinbosar', 'Рухани-ағартушылық жұмыс жөніндегі орынбасар', 'Зам. директора по духовно-просветительской работе'], -1)
    ]
  };
  N.forEach((nm, i) => {
    const s = SUBJ[i % 14];
    d.teachers.push(mk(3000 + i, 'teacher', nm, [s[1] + ' o‘qituvchisi', s[2] + ' мұғалімі', 'Учитель: ' + s[3]], s[0]));
  });
  return d;
}

let db;
try { db = JSON.parse(localStorage.getItem(K)); } catch (e) {}
if (!db || !Array.isArray(db.teachers)) { db = seed(); saveData(); }
if (typeof db.students !== 'number') { db.students = 365; }

const $ = id => document.getElementById(id);
const t = k => I[k][L];
const tr = v => Array.isArray(v) ? (v[L] || v[0] || '') : (v || '');
const pic = x => x.photo || avatar(tr(x.name), x.id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function saveData() {
  try {
    localStorage.setItem(K, JSON.stringify(db));
    return true;
  } catch (e) {
    toast(t('full'));
    return false;
  }
}

function avatar(name, i) {
  const h = (Math.abs(Number(i) || 0) * 53) % 360;
  const ini = (name || 'M').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || 'M';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h},70%,58%)"/><stop offset="1" stop-color="hsl(${(h + 40) % 360},70%,34%)"/></linearGradient></defs><rect width="200" height="200" fill="url(#g)"/><circle cx="100" cy="76" r="34" fill="#fff" fill-opacity=".88"/><path d="M34 200c4-44 32-64 66-64s62 20 66 64z" fill="#fff" fill-opacity=".88"/><text x="100" y="86" text-anchor="middle" font-size="26" font-weight="700" fill="hsl(${h},60%,28%)" font-family="sans-serif">${esc(ini)}</text></svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

function updateTexts() {
  document.querySelectorAll('[data-i]').forEach(e => {
    const k = e.dataset.i;
    if (I[k]) e.textContent = I[k][L];
  });
  document.querySelectorAll('[data-p]').forEach(e => {
    const k = e.dataset.p;
    if (I[k]) e.placeholder = I[k][L];
  });
  document.documentElement.lang = ['uz', 'kk', 'ru'][L];
}

function setLang(i) {
  L = i;
  updateTexts();
  renderAll();
}

/* Kirish: har soniyada bitta harf */
const WORD = '13-maktab';
WORD.split('').forEach((c, i) => {
  setTimeout(() => {
    const s = document.createElement('span');
    s.className = 'inline-block animate-pop [text-shadow:0_0_28px_currentColor]';
    s.textContent = c;
    s.style.cssText = `color:hsl(${i * 40 + 190},90%,65%);--x:${(Math.random() - .5) * 600}px;--y:${(Math.random() - .5) * 500}px;--r:${(Math.random() - .5) * 360}deg;`;
    $('ltr').appendChild(s);
    if (i === WORD.length - 1) {
      $('ltr').insertAdjacentHTML('beforeend', '<span class="animate-blink font-light text-white/70">|</span>');
      setTimeout(() => {
        $('wtag').style.opacity = 1;
        $('lg').classList.remove('hidden');
      }, 900);
    }
  }, (i + 1) * 1000);
});

function login() {
  if ($('lu').value.trim() === USER && $('lp').value === PASS) {
    enter('admin');
  } else {
    $('le').textContent = t('er');
    const c = $('lg');
    c.classList.remove('animate-sh');
    void c.offsetWidth;
    c.classList.add('animate-sh');
  }
}

function enter(r) {
  role = r;
  applyRole();
  $('welcome').style.opacity = 0;
  setTimeout(() => $('welcome').classList.add('hidden'), 700);
  scrollTo(0, 0);
}

function logout() {
  role = null;
  applyRole();
  $('lp').value = '';
  $('le').textContent = '';
  $('welcome').classList.remove('hidden');
  requestAnimationFrame(() => { $('welcome').style.opacity = 1; });
}

function applyRole() {
  const a = role === 'admin';
  document.querySelectorAll('.adm').forEach(e => e.classList.toggle('hidden', !a));
  renderAll();
}

const cardCls = 'transition-transform duration-200 hover:-translate-y-1.5';
const card = x => `
  <div onclick="openView(${x.id})" class="${cardCls} bg-white rounded-3xl p-6 shadow-xl border border-slate-100 cursor-pointer flex flex-col items-center text-center">
    <img src="${pic(x)}" class="w-24 h-24 rounded-2xl object-cover mb-4 shadow-md" alt="">
    <span class="px-3 py-1 rounded-full bg-blue-50 text-blue-700 text-xs font-semibold mb-2">${esc(t('c' + x.cat))}</span>
    <h3 class="font-extrabold text-lg">${esc(tr(x.name))}</h3>
    <p class="text-xs text-slate-500 mt-1">${esc(tr(x.subject))}</p>
  </div>
`;

function renderAll() {
  $('st-students').textContent = db.students;
  $('st-tch').textContent = db.teachers.filter(x => x.type === 'teacher').length;

  $('filters').innerHTML = ['all', 0, 1, 2, 3].map(i => `
    <button onclick="setFilter(${i === 'all' ? "'all'" : i})" class="px-4 py-2 rounded-xl text-xs font-semibold ${filter === i ? 'bg-blue-600 text-white' : 'bg-white text-slate-600 border border-slate-200'}">
      ${esc(t(i === 'all' ? 'all' : 'c' + i))}
    </button>
  `).join('');

  $('dir-box').innerHTML = db.teachers
    .filter(x => x.type === 'leader')
    .sort((a, b) => (LO[a.id] ?? 9) - (LO[b.id] ?? 9))
    .map(d => `
      <div onclick="openView(${d.id})" class="${cardCls} w-64 bg-white rounded-3xl p-6 shadow-xl border ${d.id === 0 ? 'border-blue-300 ring-2 ring-blue-200 order-first sm:order-none' : 'border-slate-100'} text-center cursor-pointer">
        <img src="${pic(d)}" class="w-28 h-28 rounded-2xl mx-auto object-cover mb-4 shadow-md" alt="">
        <h3 class="font-extrabold text-base">${esc(tr(d.name))}</h3>
        <p class="text-xs text-blue-600 font-semibold mt-1">${esc(tr(d.subject))}</p>
      </div>
    `).join('');

  $('f-cat').innerHTML = [0, 1, 2, 3].map(i => `<option value="${i}">${esc(t('c' + i))}</option>`).join('');
  renderGrid();
}

function renderGrid() {
  const q = $('search').value.trim().toLowerCase();
  const m = (x, s) => !s || (tr(x.name) + ' ' + tr(x.subject)).toLowerCase().includes(s);
  $('grid').innerHTML = db.teachers
    .filter(x => x.type === 'teacher' && (filter === 'all' || x.cat === filter) && m(x, q))
    .map(card)
    .join('');
}

function setFilter(f) {
  filter = f;
  renderAll();
}

function chStud(v) {
  if (role !== 'admin') return;
  db.students = Math.max(0, db.students + v);
  saveData();
  renderAll();
}

const find = id => db.teachers.find(o => o.id === id);

function openView(id) {
  const x = find(id);
  if (!x) return;
  $('v-img').src = pic(x);
  $('v-cat').textContent = x.type === 'leader' ? t('ld') : t('c' + x.cat);
  $('v-name').textContent = tr(x.name);
  $('v-subj').textContent = tr(x.subject);
  $('v-exp').textContent = tr(x.experience) || '—';
  $('v-deg').textContent = tr(x.degree) || '—';
  $('v-bio').textContent = tr(x.bio) || '—';
  $('v-ach').textContent = tr(x.achievements) || '—';
  $('v-phone').textContent = x.phone || '—';
  $('v-phone').href = x.phone ? 'tel:' + x.phone.replace(/[^\d+]/g, '') : '#';

  const a = role === 'admin';
  $('v-admin').classList.toggle('hidden', !a);
  $('v-admin').classList.toggle('flex', a);
  $('v-del').classList.toggle('hidden', x.type === 'leader');
  $('v-edit').onclick = () => openForm(x.id);
  $('v-del').onclick = () => delPerson(x.id);

  $('view').classList.remove('hidden');
  $('view').classList.add('flex');
}

function openForm(id, isNew = false) {
  if (role !== 'admin') return;
  closeM('view');
  editId = id;
  const x = find(id);
  if (!x) return;
  photo = x.photo || '';
  $('f-title').textContent = isNew ? t('at') : t('et');
  $('f-prev').src = pic(x);
  $('f-name').value = tr(x.name);
  $('f-subj').value = tr(x.subject);
  $('f-cat').value = Math.max(0, x.cat);
  $('f-exp').value = tr(x.experience);
  $('f-deg').value = tr(x.degree);
  $('f-bio').value = tr(x.bio);
  $('f-ach').value = tr(x.achievements);
  $('f-phone').value = x.phone || '';
  $('f-cat').classList.toggle('hidden', x.type === 'leader');
  $('f-file').value = '';
  $('form').classList.remove('hidden');
  $('form').classList.add('flex');
}

function onFile(e) {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 360 / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(im.width * k));
      c.height = Math.max(1, Math.round(im.height * k));
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      photo = c.toDataURL('image/jpeg', .8);
      $('f-prev').src = photo;
    };
    im.src = r.result;
  };
  r.readAsDataURL(f);
}

function setLangField(current, val) {
  const base = Array.isArray(current) ? [...current] : ['', '', ''];
  base[L] = val;
  return base;
}

function saveForm() {
  if (role !== 'admin' || busy) return;
  const nameVal = $('f-name').value.trim();
  if (!nameVal) return;
  busy = true;

  const x = find(editId);
  if (x) {
    Object.assign(x, {
      name: setLangField(x.name, nameVal),
      subject: setLangField(x.subject, $('f-subj').value.trim()),
      experience: setLangField(x.experience, $('f-exp').value.trim() || '—'),
      degree: setLangField(x.degree, $('f-deg').value.trim() || '—'),
      bio: setLangField(x.bio, $('f-bio').value.trim() || '—'),
      achievements: setLangField(x.achievements, $('f-ach').value.trim() || '—'),
      phone: $('f-phone').value.trim(),
      photo
    });
    if (x.type === 'teacher') x.cat = parseInt($('f-cat').value, 10);
    if (saveData()) {
      closeM('form');
      renderAll();
      toast(t('saved'));
    }
  }
  setTimeout(() => { busy = false; }, 700);
}

function delPerson(id) {
  if (role !== 'admin') return;
  if (!confirm(t('cf'))) return;
  db.teachers = db.teachers.filter(x => x.id !== id);
  saveData();
  closeM('view');
  renderAll();
}

function addTeacher() {
  if (role !== 'admin' || busy) return;
  busy = true;
  const newId = Date.now();
  db.teachers.push({
    id: newId,
    type: 'teacher',
    name: ['Yangi o‘qituvchi', 'Жаңа мұғалім', 'Новый учитель'],
    subject: ['Fani', 'Пәні', 'Предмет'],
    cat: 0,
    experience: '—',
    degree: '—',
    bio: '—',
    achievements: '—',
    phone: '',
    photo: ''
  });
  filter = 'all';
  if (saveData()) {
    renderAll();
    openForm(newId, true);
  }
  setTimeout(() => { busy = false; }, 500);
}

function closeM(id) {
  $(id).classList.add('hidden');
  $(id).classList.remove('flex');
}

function toast(m) {
  const e = $('toast');
  $('toast-msg').textContent = m;
  e.classList.remove('hidden');
  e.classList.add('flex');
  setTimeout(() => {
    e.classList.add('hidden');
    e.classList.remove('flex');
  }, 2500);
}

updateTexts();
applyRole();
</script>
</body>
</html>
